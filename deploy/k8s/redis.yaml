# Redis cache for a local cluster. One copy only; cached links are rebuilt from DynamoDB if it restarts.

apiVersion: apps/v1
kind: Deployment
metadata:
  # Name of this Deployment.
  name: redis
spec:
  # A single copy is enough for the cache.
  replicas: 1
  # Which pods belong to this Deployment: those carrying this label.
  selector:
    matchLabels:
      app: redis
  # The pod to create.
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          # Public Redis image.
          image: redis
          # Port the container listens on.
          ports:
            - containerPort: 6379
---
# Stable in-cluster name: tinyurl reaches Redis at redis:6379.
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  # Send traffic to pods with this label.
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
